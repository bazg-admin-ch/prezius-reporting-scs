description:
  en:
    shortDescription: Operational reports and CSV exports for precious-metal analysis and hallmarking activities.
    longDescription: >-
      Prezius Reporting presents operational data from precious-metal analysis and
      hallmarking processes at the Swiss Federal Office for Customs and Border Security.
      It builds reporting views from events published by other Prezius services and lets
      authorised users retrieve analysis and hallmarking reports. Filtered CSV exports
      support further evaluation, including breakdowns by control office and hallmarking
      characteristics. The service includes a web interface and reporting endpoints.
    features:
      - Retrieve analysis and hallmarking reports
      - Filter operational reporting data by control office
      - Export filtered hallmarking reporting data as CSV
