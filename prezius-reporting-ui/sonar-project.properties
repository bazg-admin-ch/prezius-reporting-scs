# # enable this block only for local sonar verification
# sonar.host.url=http://localhost:9000
# sonar.login=
# sonar.password=
# sonar.projectKey=

sonar.typescript.lcov.reportPaths=./coverage/sonarQube/lcov.info
sonar.testExecutionReportPaths=./coverage/sonarQube/sqr.xml
sonar.tests=./src/app
sonar.sources=./src/app
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/app/app-routing.module.ts,src/app/app.module.ts
sonar.genericcoverage.unitTestReportPaths=./coverage/sonarQube/sqr.xml
sonar.javascript.environments=jest
sonar.coverage.exclusions=**/*.js,src/main.ts,src/polyfills.ts,**/*environment*.ts,**/*module.ts

# for syntax reference see:
# www.baeldung.com/sonar-exclude-violations#using-sonar-projectproperties
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# local variables should not be declared and then immediately returned or thrown
# not just in mocks, also happens in production code, e.g. validators.ts
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1488
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

# deprecated APIs should not be used
# yes, we do use the deprecation marker, also for internal purposes,
# also in production code (not just tests)
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

# tolerate uses of "TODO" tags
# yes, we do track tiny housekeeping issues and optimazations this way
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.ts

# ignore empty function
# not just in mocks, also .e.g in dropdown.component.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.ts
